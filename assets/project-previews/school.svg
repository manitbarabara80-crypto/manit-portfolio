<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Hanna School portal visual preview</title>
  <desc id="desc">A sample school administration dashboard with navigation, student summaries, and attendance chart.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#122441"/><stop offset="1" stop-color="#071326"/></linearGradient><linearGradient id="chart" x2="0" y2="1"><stop stop-color="#37c7ef" stop-opacity=".35"/><stop offset="1" stop-color="#37c7ef" stop-opacity="0"/></linearGradient></defs>
  <rect width="960" height="500" fill="url(#bg)"/><circle cx="793" cy="80" r="190" fill="#37c7ef" opacity=".055"/>
  <rect x="41" y="34" width="878" height="432" rx="25" fill="#09172a" stroke="#37c7ef" stroke-opacity=".3" stroke-width="2"/>
  <rect x="41" y="34" width="210" height="432" rx="25" fill="#0e1e34"/><path d="M225 34h26v432h-26" fill="#0e1e34"/>
